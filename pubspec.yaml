name: quran_app
description: "IslamIndex Quran: an offline-first Quran reader."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State and navigation
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0

  # Storage. sqlite3 stays on 2.x: drift_dev's analyzer requirement is not yet
  # compatible with sqlite3 3.x on the Flutter 3.38 SDK.
  drift: ^2.28.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.1

  # UI and platform
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.1
  wakelock_plus: ^1.6.1
  file_picker: ^13.1.0
  package_info_plus: ^10.2.2

  # Text and network
  intl: ^0.20.2
  meta: ^1.17.0
  unorm_dart: ^0.3.3
  http: ^1.6.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/db/
    - assets/fonts/OFL-scheherazade-new.txt
    - assets/fonts/OFL-amiri-quran.txt
    - assets/fonts/OFL-amiri.txt
    - assets/fonts/OFL-noto-naskh-arabic.txt
    - assets/fonts/OFL-noto-sans-arabic.txt
    - assets/fonts/OFL-lateef.txt
    - assets/fonts/OFL-harmattan.txt

  fonts:
    # Quran fonts (see lib/ui/theme/quran_typography.dart). All OFL, bundled,
    # never fetched. Amiri Quran also draws every end-of-ayah ornament.
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
    - family: Harmattan
      fonts:
        - asset: assets/fonts/Harmattan-Regular.ttf
